<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>问我任何事 · Ask Me Anything · 王艺师</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #ece8df; }
    @media (prefers-color-scheme: dark) { html, body { background: #0a0a0a; } }
    body { font-family: "Space Grotesk", "Inter", "Noto Sans SC", -apple-system, system-ui, sans-serif; }
    #root { height: 100%; }
    * { box-sizing: border-box; }
    button { font: inherit; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="directions/shared.jsx"></script>
  <script type="text/babel" src="fusion/theme.jsx"></script>
  <script type="text/babel" src="fusion/chat.jsx"></script>

  <script type="text/babel">
    // Read URL params so the embedder can pin the theme, override the
    // accent color, or seed the conversation with a topic — e.g.:
    //   chat-embed.html?theme=dark
    //   chat-embed.html?accent=%2300aaff
    //   chat-embed.html?seed=projects
    const params = new URLSearchParams(location.search);
    const themePref = params.get('theme') || 'system';   // system | light | dark
    const accent    = params.get('accent') || null;
    const seed      = params.get('seed')   || null;

    function App() {
      const mode = useSystemColorScheme(themePref);
      const t = FusionTheme(mode, accent);
      return <FusionChatPanel t={t} embedded={true} seed={seed} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
